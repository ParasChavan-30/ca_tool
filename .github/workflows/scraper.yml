name: CA Knowledge Bank Scraper

on:
  # Allows remote execution via PHP Dashboard or manual execution from GitHub Actions UI
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scraping Mode'
        required: false
        default: 'once'
        type: choice
        options:
          - once
          - continuous
      source_id:
        description: 'Target Source ID (0 = all sources)'
        required: false
        default: '0'

  # Automated scheduled scraping every 6 hours (UTC)
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: scraper-job
  cancel-in-progress: false

jobs:
  run-scraper:
    name: Crawl & Ingest CA Knowledge
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper Engine
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          USE_PROXIES: "0"
          PYTHONUNBUFFERED: "1"
        run: |
          SOURCE_ID="${{ github.event.inputs.source_id }}"
          if [ -n "$SOURCE_ID" ] && [ "$SOURCE_ID" != "0" ]; then
            python scraper/runner.py --once --source-id "$SOURCE_ID"
          else
            python scraper/runner.py --once
          fi
